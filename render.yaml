# Render Blueprint: one Docker web service running nginx, the Revelio gateway and
# WitnessTrace from the repo's Dockerfile (same image as `docker compose up`).
services:
  - type: web
    name: revelio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # nginx inside the image listens on 8080.
      - key: PORT
        value: "8080"
    # Accounts and cases live under /data. Without a disk they are lost on every
    # redeploy or restart. Persistent disks need a paid plan: set `plan: starter`
    # and uncomment this block to keep them.
    # disk:
    #   name: revelio-data
    #   mountPath: /data
    #   sizeGB: 1
